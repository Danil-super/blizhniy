name: CI - Lint, Build, Audit

on:
  workflow_call:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prepare OpenSSH regression prerequisites
        run: |
          set -euo pipefail
          if ! command -v ssh >/dev/null || ! command -v ssh-keygen >/dev/null || ! test -x /usr/sbin/sshd; then
            # Install only test tools, without starting a system SSH service or
            # socket. Preserve a runner's existing service policy, including links.
            policy_file=/usr/sbin/policy-rc.d
            policy_directory="$(mktemp -d "$RUNNER_TEMP/blizhniy-service-policy.XXXXXX")"
            policy_backup="$policy_directory/policy-rc.d"
            had_policy=0
            if sudo test -e "$policy_file" || sudo test -L "$policy_file"; then
              sudo mv -- "$policy_file" "$policy_backup"
              had_policy=1
            fi
            restore_service_policy() {
              local status=$?
              sudo rm -f -- "$policy_file"
              if [[ "$had_policy" == 1 ]]; then
                sudo mv -- "$policy_backup" "$policy_file"
              fi
              return "$status"
            }
            trap restore_service_policy EXIT
            printf '#!/bin/sh\nexit 101\n' > "$policy_directory/deny-service-start"
            sudo install -m 0755 "$policy_directory/deny-service-start" "$policy_file"
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-client openssh-server
          fi
          sudo install -d -m 0755 /run/sshd
          command -v ssh >/dev/null
          command -v ssh-keygen >/dev/null
          test -x /usr/sbin/sshd
          test -d /run/sshd

      - name: Run application and security regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs tests/*.test.cjs scripts/test-*.mjs

      - name: Test expiry maintenance runner
        run: bash scripts/test-reconcile-expired-publications.sh

      - name: Test deployment watchdog and ZAP result handling
        run: |
          bash scripts/test-deploy-watchdog.sh
          bash scripts/test-check-zap-result.sh

      - name: Build
        run: npm run build

      # Dependency Review evaluates all changed dependency scopes. This audit blocks
      # high and critical vulnerabilities in dependencies shipped to production.
      - name: Audit production npm dependencies for high and critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium for layout checks
        run: npx playwright install --with-deps chromium

      - name: Check category heroes before deployment
        env:
          BASE_URL: http://127.0.0.1:3100
        run: |
          npm run dev -- -p 3100 > /tmp/blizhniy-ci-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 "$BASE_URL/katalog/instrumenty" >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS --max-time 5 "$BASE_URL/katalog/instrumenty" >/dev/null
          node scripts/check-category-heroes.mjs
          node scripts/check-instruments-hero.mjs
