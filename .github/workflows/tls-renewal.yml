name: Renew production TLS certificate

on:
  schedule:
    # Run independently of application releases so a quiet repository cannot
    # leave the 90-day Let's Encrypt certificate unattended.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tls-renewal.yml"

permissions:
  contents: read

concurrency:
  group: production-tls
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Enable Caddy automatic HTTPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          timeout 360 ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          if ! command -v caddy >/dev/null 2>&1; then
            echo 'Caddy is required to manage the public TLS certificate.' >&2
            exit 1
          fi

          caddyfile='/etc/caddy/Caddyfile'
          static_tls='tls /etc/letsencrypt/live/xn----9sbphbgks4a4a.xn--p1ai/fullchain.pem /etc/letsencrypt/live/xn----9sbphbgks4a4a.xn--p1ai/privkey.pem'

          # A file-based tls directive disables Caddy's Automatic HTTPS for the
          # named domains. Remove only that legacy Certbot certificate reference.
          if sudo -n grep -Fxq "$static_tls" "$caddyfile"; then
            backup="/etc/caddy/Caddyfile.before-auto-https-$(date -u +%Y%m%d%H%M%S)"
            sudo -n cp -p "$caddyfile" "$backup"
            sudo -n sed -i '\|^[[:space:]]*tls /etc/letsencrypt/live/xn----9sbphbgks4a4a.xn--p1ai/fullchain.pem /etc/letsencrypt/live/xn----9sbphbgks4a4a.xn--p1ai/privkey.pem[[:space:]]*$|d' "$caddyfile"

            if ! sudo -n caddy validate --config "$caddyfile" --adapter caddyfile; then
              sudo -n cp -p "$backup" "$caddyfile"
              exit 1
            fi
            if ! sudo -n systemctl reload caddy; then
              sudo -n cp -p "$backup" "$caddyfile"
              exit 1
            fi
          fi

          # Remove the hooks created for the failed Certbot/Nginx path. Caddy
          # now owns certificate issuance and renewal.
          sudo -n rm -f /etc/letsencrypt/renewal-hooks/pre/10-stop-nginx /etc/letsencrypt/renewal-hooks/post/10-start-nginx
          sudo -n systemctl disable --now certbot.timer || true

          # Caddy 2.6 skips automation when it finds an already-loaded
          # certificate, even if that cached certificate is expired. Archive
          # only expired cache entries for these two names; retain ACME account
          # data and every valid certificate.
          certificate_cache='/var/lib/caddy/.local/share/caddy/certificates'
          cache_backup="$certificate_cache/expired-before-renewal-$(date -u +%Y%m%d%H%M%S)"
          cache_changed=0
          for domain in xn----9sbphbgks4a4a.xn--p1ai www.xn----9sbphbgks4a4a.xn--p1ai; do
            while IFS= read -r cached_domain; do
              cached_certificate="$(sudo -n find "$cached_domain" -maxdepth 1 -type f -name '*.crt' -print -quit)"
              if [ -z "$cached_certificate" ] || ! sudo -n openssl x509 -checkend $((21 * 24 * 60 * 60)) -noout -in "$cached_certificate"; then
                issuer_directory="$(basename "$(dirname "$cached_domain")")"
                sudo -n mkdir -p "$cache_backup/$issuer_directory"
                sudo -n mv "$cached_domain" "$cache_backup/$issuer_directory/"
                cache_changed=1
              fi
            done < <(sudo -n find "$certificate_cache" -mindepth 2 -maxdepth 2 -type d -name "$domain" -print)
          done

          if [ "$cache_changed" -eq 1 ]; then
            sudo -n systemctl restart caddy
          fi
          sudo -n systemctl is-active --quiet caddy
          REMOTE

      - name: Verify the certificate served to visitors
        env:
          SITE_HOST: xn----9sbphbgks4a4a.xn--p1ai
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          minimum_validity_seconds=$((21 * 24 * 60 * 60))
          for attempt in $(seq 1 60); do
            certificate="$(echo | openssl s_client -connect "$SITE_HOST:443" -servername "$SITE_HOST" 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null || true)"
            expires_at="$(printf '%s\n' "$certificate" | sed -n 's/^notAfter=//p')"

            if [ -n "$expires_at" ]; then
              expires_epoch="$(date --date="$expires_at" +%s)"
              now_epoch="$(date +%s)"
              if (( expires_epoch - now_epoch >= minimum_validity_seconds )); then
                printf '%s\n' "$certificate"
                exit 0
              fi
            fi

            sleep 5
          done

          echo 'Caddy did not present a certificate valid for at least 21 days.' >&2
          echo 'Recent Caddy journal:' >&2
          timeout 60 ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            "$VPS_USER@$VPS_HOST" \
            'sudo -n journalctl -u caddy --since "10 minutes ago" --no-pager -n 160' >&2 || true
          exit 1
