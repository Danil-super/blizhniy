name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      publish_release: true
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security-checks.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  deploy:
    needs: [validate, security, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      remote_dir: ${{ steps.ship.outputs.remote_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download the verified production artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: ${{ runner.temp }}

      - name: Deploy over SSH
        id: ship
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          RELEASE_ARCHIVE_SHA256: ${{ needs.validate.outputs.archive_sha256 }}
        run: |
          set -euo pipefail

          SSH_DIRECTORY="$RUNNER_TEMP/blizhniy-ssh"
          bash scripts/setup-deployment-ssh.sh "$VPS_HOST" "$VPS_PORT" "$SSH_DIRECTORY"
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_DIRECTORY/deploy_key"
          chmod 600 "$SSH_DIRECTORY/deploy_key"

          SSH_OPTS=(
            -F "$SSH_DIRECTORY/ssh_config"
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_DIRECTORY/known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8
            -o ConnectTimeout=30 -o IPQoS=none -o Compression=yes
            -o KexAlgorithms=+diffie-hellman-group14-sha256
            -o PubkeyAcceptedAlgorithms=+ssh-rsa
          )

          retry() {
            local attempt

            for attempt in 1 2 3 4 5 6 7 8; do
              if "$@"; then
                return 0
              fi

              sleep "$((attempt * 5))"
            done

            return 1
          }

          RUN_TOKEN="${{ github.run_id }}-${{ github.run_attempt }}"
          ARCHIVE_NAME="blizhniy-${RUN_TOKEN}.tar.gz"
          LOCAL_ARCHIVE="$RUNNER_TEMP/${ARCHIVE_NAME}"
          # mktemp creates this directory atomically with owner-only access.
          # Keep every executable, archive and watchdog signal inside it.
          REMOTE_DIR="$(retry ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mktemp -d /tmp/blizhniy-deploy-XXXXXXXXXXXX")"
          if [[ ! "$REMOTE_DIR" =~ ^/tmp/blizhniy-deploy-[a-zA-Z0-9]{12}$ ]]; then
            echo "Remote staging directory was not returned in the expected format." >&2
            exit 1
          fi
          printf 'remote_dir=%s\n' "$REMOTE_DIR" >> "$GITHUB_OUTPUT"
          REMOTE_ARCHIVE="$REMOTE_DIR/${ARCHIVE_NAME}"
          LOCAL_SCRIPT="$RUNNER_TEMP/blizhniy-deploy-${RUN_TOKEN}.sh"
          REMOTE_SCRIPT="$REMOTE_DIR/blizhniy-deploy-${RUN_TOKEN}.sh"
          LOCAL_RUNNER="$RUNNER_TEMP/blizhniy-deploy-runner-${RUN_TOKEN}.sh"
          REMOTE_RUNNER="$REMOTE_DIR/blizhniy-deploy-runner-${RUN_TOKEN}.sh"
          REMOTE_LOG="$REMOTE_DIR/deploy.log"
          REMOTE_STATUS="$REMOTE_DIR/deploy.status"
          REMOTE_RESULT="$REMOTE_DIR/deploy.result"
          REMOTE_CONFIRMED="$REMOTE_DIR/deploy.confirmed"
          REMOTE_ABORT="$REMOTE_DIR/deploy.abort"
          DEPLOY_RECORD="$REMOTE_DIR/release.record"
          REMOTE_WATCHDOG="$REMOTE_DIR/deploy-watchdog.sh"

          [[ "$RELEASE_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          cp "$RUNNER_TEMP/release.tar.gz" "$LOCAL_ARCHIVE"
          test -f "$LOCAL_ARCHIVE"

          du -h "$LOCAL_ARCHIVE"

          cat > "$LOCAL_SCRIPT" <<'EOF'
            set -euo pipefail
            [[ "$SOURCE_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
            printf '%s  %s\n' "$SOURCE_ARCHIVE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check --status
            WORK_DIR="$REMOTE_DIR/source"
            mkdir "$WORK_DIR"
            tar --no-same-owner --no-same-permissions -xzf "$SOURCE_ARCHIVE" -C "$WORK_DIR"
            bash "$WORK_DIR/scripts/deploy-release.sh"
            rm -rf "$WORK_DIR" "$SOURCE_ARCHIVE" "$0" || true
          EOF

          {
            printf '#!/usr/bin/env bash\n'
            printf 'set +e\n'
            printf 'export PATH="/opt/blizhniy-node22/bin:$PATH"\n'
            printf 'export PREBUILT_RELEASE=true\n'
            printf 'export SOURCE_ARCHIVE_SHA256=%q\n' "$RELEASE_ARCHIVE_SHA256"
            printf 'export APP_DIR=%q\n' "$APP_DIR"
            printf 'export SOURCE_ARCHIVE=%q\n' "$REMOTE_ARCHIVE"
            printf 'export COMMIT_SHA=%q\n' "${{ github.sha }}"
            printf 'export RUN_TOKEN=%q\n' "$RUN_TOKEN"
            printf 'export REMOTE_DIR=%q\n' "$REMOTE_DIR"
            printf 'export REMOTE_SCRIPT=%q\n' "$REMOTE_SCRIPT"
            printf 'export REMOTE_STATUS=%q\n' "$REMOTE_STATUS"
            printf 'export REMOTE_RESULT=%q\n' "$REMOTE_RESULT"
            printf 'export REMOTE_CONFIRMED=%q\n' "$REMOTE_CONFIRMED"
            printf 'export REMOTE_ABORT=%q\n' "$REMOTE_ABORT"
            printf 'export DEPLOY_RECORD=%q\n' "$DEPLOY_RECORD"
            printf 'bash %q\n' "$REMOTE_WATCHDOG"
            printf 'status=$?\n'
            printf 'rm -f "$0"\n'
            printf 'exit "$status"\n'
          } > "$LOCAL_RUNNER"

          retry scp "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -P "$VPS_PORT" "$LOCAL_ARCHIVE" "$LOCAL_SCRIPT" "$LOCAL_RUNNER" "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"
          retry scp "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -P "$VPS_PORT" scripts/deploy-watchdog.sh "$VPS_USER@$VPS_HOST:$REMOTE_WATCHDOG"

          retry ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "rm -f '$REMOTE_LOG' '$REMOTE_STATUS' '$REMOTE_RESULT' '$REMOTE_CONFIRMED' '$REMOTE_ABORT'; chmod +x '$REMOTE_RUNNER'; nohup bash '$REMOTE_RUNNER' > '$REMOTE_LOG' 2>&1 < /dev/null &"

          for poll_attempt in $(seq 1 80); do
            if ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "test -f '$REMOTE_STATUS'"; then
              retry ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "tail -n 200 '$REMOTE_LOG' || true"
              DEPLOY_STATUS="$(retry ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cat '$REMOTE_STATUS'")"
              exit "$DEPLOY_STATUS"
            fi

            if (( poll_attempt % 8 == 0 )); then
              retry ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "tail -n 80 '$REMOTE_LOG' || true" || true
            fi

            sleep 15
          done

          retry ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "tail -n 200 '$REMOTE_LOG' || true" || true
          echo "Deploy timed out while waiting for remote status file."
          exit 124

  postchecks:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js for deployed layout checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install layout check dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check deployed category heroes on mobile and desktop
        env:
          BASE_URL: https://xn----9sbphbgks4a4a.xn--p1ai
        run: node scripts/check-category-heroes.mjs

      - name: Check deployed instruments hero
        env:
          BASE_URL: https://xn----9sbphbgks4a4a.xn--p1ai
        run: node scripts/check-instruments-hero.mjs

      - name: Check deployed public SEO and readiness
        env:
          BASE_URL: https://xn----9sbphbgks4a4a.xn--p1ai
        run: node scripts/check-public-seo.mjs

      - name: Check deployed production security headers
        env:
          BASE_URL: https://xn----9sbphbgks4a4a.xn--p1ai
        run: node scripts/check-production-headers.mjs

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: category-heroes-responsive
          path: artifacts/category-heroes
          if-no-files-found: warn
          retention-days: 14

  finalize:
    needs: [deploy, postchecks]
    if: ${{ always() && needs.deploy.outputs.remote_dir != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure SSH for finalization
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          SSH_DIRECTORY="$RUNNER_TEMP/blizhniy-ssh"
          bash scripts/setup-deployment-ssh.sh "$VPS_HOST" "$VPS_PORT" "$SSH_DIRECTORY"
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_DIRECTORY/deploy_key"
          chmod 600 "$SSH_DIRECTORY/deploy_key"

      - name: Confirm deployed release
        if: ${{ needs.deploy.result == 'success' && needs.postchecks.result == 'success' }}
        env:
          REMOTE_DIR: ${{ needs.deploy.outputs.remote_dir }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH_DIRECTORY="$RUNNER_TEMP/blizhniy-ssh"
          SSH_OPTS=(
            -F "$SSH_DIRECTORY/ssh_config"
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_DIRECTORY/known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8
            -o ConnectTimeout=30 -o IPQoS=none -o Compression=yes
            -o KexAlgorithms=+diffie-hellman-group14-sha256
            -o PubkeyAcceptedAlgorithms=+ssh-rsa
          )
          if [[ ! "$REMOTE_DIR" =~ ^/tmp/blizhniy-deploy-[a-zA-Z0-9]{12}$ ]]; then
            echo "Remote staging directory is missing or invalid." >&2
            exit 1
          fi
          remote_confirm="$REMOTE_DIR/deploy.confirmed"
          remote_result="$REMOTE_DIR/deploy.result"
          ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "touch '$remote_confirm'"
          for attempt in $(seq 1 30); do
            result="$(ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cat '$remote_result' 2>/dev/null || true")"
            if [[ "$result" == "confirmed" ]]; then
              exit 0
            fi
            if [[ -n "$result" ]]; then
              echo "Remote release result: $result" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Remote confirmation result is unknown; host watchdog will roll back if it was not confirmed." >&2
          exit 1

      - name: Roll back release if a deployed check failed
        if: ${{ always() && (needs.deploy.result != 'success' || needs.postchecks.result != 'success' || failure()) }}
        env:
          REMOTE_DIR: ${{ needs.deploy.outputs.remote_dir }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -euo pipefail
          SSH_DIRECTORY="$RUNNER_TEMP/blizhniy-ssh"
          SSH_OPTS=(
            -F "$SSH_DIRECTORY/ssh_config"
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_DIRECTORY/known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8
            -o ConnectTimeout=30 -o IPQoS=none -o Compression=yes
            -o KexAlgorithms=+diffie-hellman-group14-sha256
            -o PubkeyAcceptedAlgorithms=+ssh-rsa
          )
          # The server runner holds the release lock and owns rollback. If SSH
          # is unavailable, its 30-minute confirmation lease still expires.
          if [[ ! -f "$SSH_DIRECTORY/deploy_key" ]]; then
            echo "Deploy never initialized its SSH key; no release switch was attempted."
            exit 0
          fi
          if [[ -z "$REMOTE_DIR" ]]; then
            echo "Deploy never allocated remote staging; no release switch was attempted."
            exit 0
          fi
          if [[ ! "$REMOTE_DIR" =~ ^/tmp/blizhniy-deploy-[a-zA-Z0-9]{12}$ ]]; then
            echo "Remote staging directory is invalid; refusing to signal another path." >&2
            exit 1
          fi
          remote_abort="$REMOTE_DIR/deploy.abort"
          remote_result="$REMOTE_DIR/deploy.result"
          ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "touch '$remote_abort'" || {
            echo "Could not signal remote runner. Outcome unknown until its lease expires; inspect VPS release status." >&2
            exit 1
          }
          for attempt in $(seq 1 60); do
            result="$(ssh "${SSH_OPTS[@]}" -i "$SSH_DIRECTORY/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cat '$remote_result' 2>/dev/null || true")" || true
            if [[ "$result" == "rolled_back" || "$result" == "deploy_failed" || "$result" == "lock_busy" ]]; then
              echo "Remote release result: $result"
              exit 0
            fi
            if [[ "$result" == "rollback_failed" || "$result" == "confirmed" ]]; then
              echo "Remote release result: $result" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Remote result is unknown; the host confirmation lease remains the recovery path." >&2
          exit 1
