name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS="-o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o ConnectTimeout=30 -o IPQoS=none -o Compression=yes -o KexAlgorithms=+diffie-hellman-group14-sha256 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa"

          retry() {
            local attempt

            for attempt in 1 2 3 4 5 6 7 8; do
              if "$@"; then
                return 0
              fi

              sleep "$((attempt * 5))"
            done

            return 1
          }

          retry ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

          ARCHIVE_NAME="blizhniy-${{ github.sha }}.tar.gz"
          LOCAL_ARCHIVE="/tmp/${ARCHIVE_NAME}"
          REMOTE_ARCHIVE="/tmp/${ARCHIVE_NAME}"
          LOCAL_SCRIPT="/tmp/blizhniy-deploy-${{ github.sha }}.sh"
          REMOTE_SCRIPT="/tmp/blizhniy-deploy-${{ github.sha }}.sh"
          LOCAL_RUNNER="/tmp/blizhniy-deploy-runner-${{ github.sha }}.sh"
          REMOTE_RUNNER="/tmp/blizhniy-deploy-runner-${{ github.sha }}.sh"
          REMOTE_LOG="/tmp/blizhniy-deploy-${{ github.sha }}.log"
          REMOTE_STATUS="/tmp/blizhniy-deploy-${{ github.sha }}.status"

          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.next \
            --exclude=node_modules \
            --exclude=category \
            --exclude=docs \
            --exclude=supabase \
            --exclude=blizhniy_codex_tz.md \
            -czf "$LOCAL_ARCHIVE" .

          du -h "$LOCAL_ARCHIVE"

          cat > "$LOCAL_SCRIPT" <<'EOF'
            set -euo pipefail
            WORK_DIR="/tmp/blizhniy-deploy-${COMMIT_SHA}"
            rm -rf "$WORK_DIR"
            mkdir -p "$WORK_DIR"
            tar -xzf "$SOURCE_ARCHIVE" -C "$WORK_DIR"
            bash "$WORK_DIR/scripts/deploy-release.sh"
            rm -rf "$WORK_DIR" "$SOURCE_ARCHIVE" "$0"
          EOF

          {
            printf '#!/usr/bin/env bash\n'
            printf 'set +e\n'
            printf 'export APP_DIR=%q\n' "$APP_DIR"
            printf 'export SOURCE_ARCHIVE=%q\n' "$REMOTE_ARCHIVE"
            printf 'export COMMIT_SHA=%q\n' "${{ github.sha }}"
            printf 'bash %q\n' "$REMOTE_SCRIPT"
            printf 'status=$?\n'
            printf 'printf "%%s\\n" "$status" > %q\n' "$REMOTE_STATUS"
            printf 'rm -f "$0"\n'
            printf 'exit "$status"\n'
          } > "$LOCAL_RUNNER"

          retry scp $SSH_OPTS -i ~/.ssh/deploy_key -P "$VPS_PORT" "$LOCAL_ARCHIVE" "$LOCAL_SCRIPT" "$LOCAL_RUNNER" "$VPS_USER@$VPS_HOST:/tmp/"

          retry ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "rm -f '$REMOTE_LOG' '$REMOTE_STATUS'; chmod +x '$REMOTE_RUNNER'; nohup bash '$REMOTE_RUNNER' > '$REMOTE_LOG' 2>&1 < /dev/null &"

          for poll_attempt in $(seq 1 80); do
            if ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "test -f '$REMOTE_STATUS'"; then
              retry ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "tail -n 200 '$REMOTE_LOG' || true"
              DEPLOY_STATUS="$(retry ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cat '$REMOTE_STATUS'")"
              retry ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "rm -f '$REMOTE_LOG' '$REMOTE_STATUS'" || true
              exit "$DEPLOY_STATUS"
            fi

            if (( poll_attempt % 8 == 0 )); then
              retry ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "tail -n 80 '$REMOTE_LOG' || true" || true
            fi

            sleep 15
          done

          retry ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "tail -n 200 '$REMOTE_LOG' || true" || true
          echo "Deploy timed out while waiting for remote status file."
          exit 124
