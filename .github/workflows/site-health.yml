name: Production site health

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-site-health
  cancel-in-progress: false

jobs:
  probe:
    name: Probe web and database readiness from outside the VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.3

      - name: Verify health and readiness
        run: |
          if node scripts/check-site-health.mjs; then exit 0; fi
          sleep 10
          node scripts/check-site-health.mjs
