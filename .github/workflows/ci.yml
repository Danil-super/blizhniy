name: CI - Lint, Build, Audit

on:
  workflow_call:
    inputs:
      publish_release:
        type: boolean
        default: false
    outputs:
      archive_sha256:
        value: ${{ jobs.validate.outputs.archive_sha256 }}
      artifact_name:
        value: ${{ jobs.validate.outputs.artifact_name }}
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.3
          cache: npm

      - name: Guard quality floor
        env:
          QUALITY_FLOOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base="${QUALITY_FLOOR_BASE:-HEAD^}"
          node scripts/check-quality-floor.mjs --base "$base"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check:types

      - name: Lint
        run: npm run lint

      - name: Prepare OpenSSH regression prerequisites
        run: |
          set -euo pipefail
          if ! command -v ssh >/dev/null || ! command -v ssh-keygen >/dev/null || ! test -x /usr/sbin/sshd; then
            # Install only test tools, without starting a system SSH service or
            # socket. Preserve a runner's existing service policy, including links.
            policy_file=/usr/sbin/policy-rc.d
            policy_directory="$(mktemp -d "$RUNNER_TEMP/blizhniy-service-policy.XXXXXX")"
            policy_backup="$policy_directory/policy-rc.d"
            had_policy=0
            if sudo test -e "$policy_file" || sudo test -L "$policy_file"; then
              sudo mv -- "$policy_file" "$policy_backup"
              had_policy=1
            fi
            restore_service_policy() {
              local status=$?
              sudo rm -f -- "$policy_file"
              if [[ "$had_policy" == 1 ]]; then
                sudo mv -- "$policy_backup" "$policy_file"
              fi
              return "$status"
            }
            trap restore_service_policy EXIT
            printf '#!/bin/sh\nexit 101\n' > "$policy_directory/deny-service-start"
            sudo install -m 0755 "$policy_directory/deny-service-start" "$policy_file"
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-client openssh-server
          fi
          sudo install -d -m 0755 /run/sshd
          command -v ssh >/dev/null
          command -v ssh-keygen >/dev/null
          test -x /usr/sbin/sshd
          test -d /run/sshd

      - name: Run application and security regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs tests/*.test.cjs scripts/test-*.mjs

      - name: Test expiry maintenance runner
        run: bash scripts/test-reconcile-expired-publications.sh

      - name: Test deployment watchdog and ZAP result handling
        run: |
          bash scripts/test-deploy-watchdog.sh
          bash scripts/test-check-zap-result.sh

      - name: Run isolated PostgreSQL 18 integration gate
        run: |
          set -euo pipefail
          bash scripts/prepare-ci-browser.sh
          docker --host unix:///var/run/docker.sock pull postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          for suite in \
            tests/postgres-integration.mjs \
            tests/bootstrap-postgres-integration.mjs \
            tests/telegram-phone-postgres-integration.mjs \
            tests/account-deletion-postgres-integration.mjs \
            tests/profession-catalog-postgres-integration.mjs \
            tests/primary-search-postgres-integration.mjs \
            tests/booking-lifecycle-postgres.mjs \
            tests/payment-reconciliation-deletion-postgres.mjs \
            tests/placement-refund-approval-postgres.mjs \
            tests/application-compensation-cases-postgres.mjs \
            tests/work-owner-actions-postgres.mjs \
            tests/response-checkout-fence-postgres.mjs \
            tests/checkout-cancellation-postgres.mjs \
            tests/publication-test-postgres.mjs \
            tests/publication-test-release-postgres.mjs \
            tests/approved-account-export-postgres.mjs \
            tests/specialist-checkout-postgres.mjs \
            tests/specialist-checkout-guards-postgres.mjs
          do
            node --experimental-strip-types --test --test-concurrency=1 "$suite"
          done

      - name: Build the production artifact on GitHub
        env:
          BLIZHNIY_BUILD_COMMIT: ${{ github.sha }}
          __NEXT_PROCESSED_ENV: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Package and check the production artifact
        id: package
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/release.tar.gz"
          node --input-type=module - "$archive" <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {packagePrebuiltRelease} from './scripts/package-prebuilt-release.mjs';
          const result=packagePrebuiltRelease({source:process.cwd(),output:process.argv[2],commit:process.env.GITHUB_SHA});
          appendFileSync(process.env.GITHUB_OUTPUT,`archive_sha256=${result.sha256}\nartifact_name=production-release-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}\n`);
          NODE
          check_root="$(mktemp -d "$RUNNER_TEMP/blizhniy-artifact-check.XXXXXXXX")"
          tar --no-same-owner --no-same-permissions -xzf "$archive" -C "$check_root"
          node scripts/verify-prebuilt-release.mjs "$check_root" "$GITHUB_SHA"
          node --experimental-strip-types scripts/check-prebuilt-runtime.mjs "$check_root"

      - name: Upload the verified production artifact
        if: ${{ inputs.publish_release }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/release.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1


      # Dependency Review evaluates all changed dependency scopes. This audit blocks
      # high and critical vulnerabilities in dependencies shipped to production.
      - name: Audit production npm dependencies for high and critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  # Independent layout checks still contribute to this reusable workflow's result.
  # The caller's deploy job requires the whole workflow, not just the validate job.
  category_heroes:
    name: Validate category layouts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Guard quality floor
        env:
          QUALITY_FLOOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base="${QUALITY_FLOOR_BASE:-HEAD^}"
          node scripts/check-quality-floor.mjs --base "$base"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for layout checks
        run: bash scripts/prepare-ci-browser.sh

      - name: Check category heroes before deployment
        env:
          BASE_URL: http://127.0.0.1:3100
        run: |
          npm run dev -- -p 3100 > /tmp/blizhniy-ci-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 "$BASE_URL/katalog/instrumenty" >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS --max-time 5 "$BASE_URL/katalog/instrumenty" >/dev/null
          node scripts/check-category-heroes.mjs
          node scripts/check-instruments-hero.mjs
