name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS="-o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 -o KexAlgorithms=+diffie-hellman-group14-sha256 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa"

          retry() {
            local attempt

            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi

              sleep "$((attempt * 5))"
            done

            return 1
          }

          retry ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

          ARCHIVE_NAME="blizhniy-${{ github.sha }}.tar.gz"
          LOCAL_ARCHIVE="/tmp/${ARCHIVE_NAME}"
          REMOTE_ARCHIVE="/tmp/${ARCHIVE_NAME}"
          LOCAL_SCRIPT="/tmp/blizhniy-deploy-${{ github.sha }}.sh"
          REMOTE_SCRIPT="/tmp/blizhniy-deploy-${{ github.sha }}.sh"

          git archive --format=tar.gz --output="$LOCAL_ARCHIVE" "${{ github.sha }}"

          cat > "$LOCAL_SCRIPT" <<'EOF'
            set -euo pipefail
            WORK_DIR="/tmp/blizhniy-deploy-${COMMIT_SHA}"
            rm -rf "$WORK_DIR"
            mkdir -p "$WORK_DIR"
            tar -xzf "$SOURCE_ARCHIVE" -C "$WORK_DIR"
            bash "$WORK_DIR/scripts/deploy-release.sh"
            rm -rf "$WORK_DIR" "$SOURCE_ARCHIVE" "$0"
          EOF

          retry scp $SSH_OPTS -i ~/.ssh/deploy_key -P "$VPS_PORT" "$LOCAL_ARCHIVE" "$LOCAL_SCRIPT" "$VPS_USER@$VPS_HOST:/tmp/"

          retry ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "APP_DIR='$APP_DIR' SOURCE_ARCHIVE='$REMOTE_ARCHIVE' COMMIT_SHA='${{ github.sha }}' bash '$REMOTE_SCRIPT'"
