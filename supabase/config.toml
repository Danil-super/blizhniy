# Local development only. Historical cloud migrations are not a clean installer.
project_id = "blizhniy-local"

[api]
enabled = true
port = 54341
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54342
shadow_port = 54340
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = false

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false
port = 54343

[local_smtp]
enabled = true
port = 54344

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3005"
additional_redirect_urls = ["http://127.0.0.1:3005/auth/callback", "http://127.0.0.1:3005/kabinet"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
