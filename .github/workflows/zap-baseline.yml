name: DAST - OWASP ZAP Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Site URL to scan"
        required: true
        default: "https://xn----9sbphbgks4a4a.xn--p1ai"
  schedule:
    # Runs every Monday at 03:00 UTC.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: zap-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TARGET_URL: ${{ github.event.inputs.target_url || 'https://xn----9sbphbgks4a4a.xn--p1ai' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Prepare scan reports
        run: |
          echo "Scanning: ${TARGET_URL}"
          install -d -m 2770 "${RUNNER_TEMP}/zap-reports"
          echo "ZAP_REPORT_DIR=${RUNNER_TEMP}/zap-reports" >> "${GITHUB_ENV}"

      - name: Run ZAP baseline scan
        id: zap
        run: |
          set +e
          docker run --rm \
            --group-add "$(id -g)" \
            -v "${ZAP_REPORT_DIR}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${TARGET_URL}" \
              -r zap-report.html \
              -J zap-report.json \
              -w zap-report.md 2>&1 | tee "${ZAP_REPORT_DIR}/zap-baseline.log"
          statuses=("${PIPESTATUS[@]}")
          ZAP_EXIT_CODE=${statuses[0]}
          if [[ "${statuses[1]}" != 0 ]]; then exit 1; fi
          echo "exit_code=${ZAP_EXIT_CODE}" >> "${GITHUB_OUTPUT}"
          set -e

      - name: Add ZAP report to job summary
        if: always()
        run: |
          {
            echo "## OWASP ZAP Baseline Scan"
            echo ""
            echo "Target: ${TARGET_URL}"
            echo "ZAP exit code: ${{ steps.zap.outputs.exit_code }}"
            echo ""
            if [ -f "${ZAP_REPORT_DIR}/zap-report.md" ]; then
              cat "${ZAP_REPORT_DIR}/zap-report.md"
            else
              echo "ZAP report was not generated."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: zap-baseline-report
          path: |
            ${{ env.ZAP_REPORT_DIR }}/zap-report.html
            ${{ env.ZAP_REPORT_DIR }}/zap-report.json
            ${{ env.ZAP_REPORT_DIR }}/zap-report.md
            ${{ env.ZAP_REPORT_DIR }}/zap-baseline.log
          if-no-files-found: error
          retention-days: 14

      - name: Verify ZAP findings and reports
        if: always()
        run: bash scripts/check-zap-result.sh '${{ steps.zap.outputs.exit_code }}'
