name: CI - Lint, Build, Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test Supabase REST timeout and write retry behavior
        run: node --experimental-strip-types --test tests/supabase-rest.test.mjs

      - name: Test expiry maintenance runner
        run: bash scripts/test-reconcile-expired-publications.sh

      - name: Build
        run: npm run build

      - name: Audit production npm dependencies for high and critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium for layout checks
        run: npx playwright install --with-deps chromium

      - name: Check category heroes before deployment
        env:
          BASE_URL: http://127.0.0.1:3100
        run: |
          npm run dev -- -p 3100 > /tmp/blizhniy-ci-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 "$BASE_URL/katalog/instrumenty" >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS --max-time 5 "$BASE_URL/katalog/instrumenty" >/dev/null
          node scripts/check-category-heroes.mjs
          node scripts/check-instruments-hero.mjs
