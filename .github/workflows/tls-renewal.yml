name: Renew production TLS certificate

on:
  schedule:
    # Run independently of application releases so a quiet repository cannot
    # leave the 90-day Let's Encrypt certificate unattended.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tls-renewal.yml"

permissions:
  contents: read

concurrency:
  group: production-tls
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Renew certificate and enable local renewal timer
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          timeout 360 ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          if ! command -v certbot >/dev/null 2>&1; then
            echo 'certbot is not installed on the VPS.' >&2
            exit 1
          fi

          # Let’s Encrypt may follow an HTTP redirect to HTTPS. Keep the
          # challenge path static in the TLS virtual host too, rather than proxying
          # it to the Next.js application (which responds 404).
          nginx_site=/etc/nginx/sites-enabled/blizhniy
          # Older diagnostic runs left a temporary backup in sites-enabled, where
          # Nginx loads every file and treats it as a second default server.
          sudo -n find /etc/nginx/sites-enabled -maxdepth 1 -type f -name 'blizhniy.before-acme-*' -delete
          if ! sudo -n awk '
            /^[[:space:]]*listen[[:space:]]+443[[:space:]]+ssl/ { in_tls_server = 1 }
            in_tls_server && /location[[:space:]]+\^~[[:space:]]+\/\.well-known\/acme-challenge\// { found = 1 }
            END { exit found ? 0 : 1 }
          ' "$nginx_site"; then
            sudo -n cp -p "$nginx_site" "/tmp/blizhniy.before-acme-$(date -u +%Y%m%d%H%M%S)"
            sudo -n python3 - "$nginx_site" <<'PY'
          from pathlib import Path
          import sys

          site = Path(sys.argv[1])
          config = site.read_text()
          anchor = "    location /_next/static/ {\n"
          acme_location = """    location ^~ /.well-known/acme-challenge/ {
                  root /var/www/certbot;
                  default_type text/plain;
                  try_files $uri =404;
              }

          """
          position = config.find(anchor)
          if position < 0:
              raise SystemExit("TLS static-files location was not found in Nginx vhost")
          tls_prefix = config[config.rfind("server {", 0, position):position]
          if "location ^~ /.well-known/acme-challenge/" not in tls_prefix:
              site.write_text(config[:position] + acme_location + config[position:])
          PY
            sudo -n nginx -t
            sudo -n systemctl reload nginx
          fi

          probe_token="acme-probe-$(date -u +%s)-$RANDOM"
          probe_path="/var/www/certbot/.well-known/acme-challenge/$probe_token"
          sudo -n install -d -m 0755 /var/www/certbot/.well-known/acme-challenge
          printf '%s' "$probe_token" | sudo -n tee "$probe_path" >/dev/null
          sudo -n chmod 0644 "$probe_path"
          cleanup_probe() { sudo -n rm -f "$probe_path"; }
          trap cleanup_probe EXIT
          show_nginx_acme_routing() {
            echo 'Nginx ACME routing:' >&2
            sudo -n sed -n '1,300p' "$nginx_site" || true
            sudo -n nginx -T 2>&1 | awk '
              /^# configuration file / { current_file = $0 }
              /server_name/ || /acme-challenge/ || /root +\/var\/www\/certbot/ {
                print current_file
                print
              }
            ' || true
          }

          for host in xn----9sbphbgks4a4a.xn--p1ai www.xn----9sbphbgks4a4a.xn--p1ai; do
            for scheme in http https; do
              port=80
              # The currently served certificate may be expired while this
              # pre-renewal route probe follows the HTTP-to-HTTPS redirect.
              curl_flags=(--fail --silent --show-error --max-time 15 --insecure)
              if [ "$scheme" = https ]; then
                port=443
              fi

              if ! local_response="$(curl "${curl_flags[@]}" --resolve "$host:$port:127.0.0.1" "$scheme://$host/.well-known/acme-challenge/$probe_token")"; then
                echo "ACME probe failed for the local $scheme route on $host." >&2
                show_nginx_acme_routing
                exit 1
              fi
              if ! public_response="$(curl "${curl_flags[@]}" --location "$scheme://$host/.well-known/acme-challenge/$probe_token")"; then
                echo "ACME probe failed for the public $scheme route on $host." >&2
                show_nginx_acme_routing
                exit 1
              fi
              if [ "$local_response" != "$probe_token" ] || [ "$public_response" != "$probe_token" ]; then
                echo "ACME probe returned unexpected content for $scheme://$host." >&2
                show_nginx_acme_routing
                exit 1
              fi
            done
          done

          if ! timeout --foreground 300 sudo -n certbot renew --no-random-sleep-on-renew --deploy-hook 'systemctl reload nginx'; then
            echo 'certbot renewal failed or did not complete within five minutes.' >&2
            sudo -n systemctl status certbot.timer --no-pager || true
            sudo -n journalctl -u certbot.service -n 50 --no-pager || true
            sudo -n tail -n 120 /var/log/letsencrypt/letsencrypt.log || true
            sudo -n sed -n '1,160p' /etc/letsencrypt/renewal/xn----9sbphbgks4a4a.xn--p1ai.conf || true
            echo 'Nginx virtual host configuration:' >&2
            sudo -n sed -n '1,260p' /etc/nginx/sites-enabled/blizhniy || true
            echo 'Nginx ACME routing:' >&2
            sudo -n nginx -T 2>&1 | awk '
              /^# configuration file / { current_file = $0 }
              /server_name/ || /acme-challenge/ || /root +\/var\/www\/certbot/ {
                print current_file
                print
              }
            ' || true
            exit 1
          fi

          timer_enabled=false
          for timer in certbot.timer snap.certbot.renew.timer; do
            if systemctl list-unit-files --type=timer --no-legend "$timer" 2>/dev/null | awk '{print $1}' | grep -Fxq "$timer"; then
              sudo -n systemctl enable --now "$timer"
              timer_enabled=true
            fi
          done

          if [ "$timer_enabled" = false ]; then
            echo 'No system Certbot timer was found; GitHub Actions will perform the daily renewal check.' >&2
          fi

          sudo -n certbot certificates
          REMOTE

      - name: Verify the certificate served to visitors
        env:
          SITE_HOST: xn----9sbphbgks4a4a.xn--p1ai
        run: |
          set -euo pipefail

          certificate="$(echo | openssl s_client -connect "$SITE_HOST:443" -servername "$SITE_HOST" 2>/dev/null | openssl x509 -noout -subject -issuer -enddate)"
          printf '%s\n' "$certificate"

          expires_at="$(printf '%s\n' "$certificate" | sed -n 's/^notAfter=//p')"
          expires_epoch="$(date --date="$expires_at" +%s)"
          now_epoch="$(date +%s)"
          minimum_validity_seconds=$((21 * 24 * 60 * 60))

          if (( expires_epoch - now_epoch < minimum_validity_seconds )); then
            echo "The public certificate expires too soon: $expires_at" >&2
            exit 1
          fi
