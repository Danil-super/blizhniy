name: Security Checks - SAST, Secrets, Dependencies

on:
  workflow_call:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare reports directory
        run: mkdir -p security-reports

      - name: Setup Node.js for report validation
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Scan secrets with Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect \
              --source=/repo \
              --redact \
              --report-format=sarif \
              --report-path=/repo/security-reports/gitleaks.sarif \
              --exit-code=1

      - name: Scan code with Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            semgrep/semgrep:1.109.0 \
            semgrep scan \
              --config=auto \
              --sarif \
              --output=security-reports/semgrep.sarif

      - name: Block severe static analysis findings
        if: ${{ steps.semgrep.outcome == 'success' }}
        id: semgrep_gate
        continue-on-error: true
        run: node scripts/check-semgrep-report.mjs security-reports/semgrep.sarif

      - name: Scan dependencies and config with Trivy
        id: trivy
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            aquasec/trivy:0.58.2 \
            fs \
              --scanners vuln,secret,misconfig \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format sarif \
              --output /repo/security-reports/trivy.sarif \
              /repo

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-reports
          path: security-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gitleaks SARIF to GitHub Security
        if: ${{ always() && vars.ENABLE_CODE_SCANNING_UPLOAD == 'true' && hashFiles('security-reports/gitleaks.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: security-reports/gitleaks.sarif
          category: gitleaks

      - name: Upload Semgrep SARIF to GitHub Security
        if: ${{ always() && vars.ENABLE_CODE_SCANNING_UPLOAD == 'true' && hashFiles('security-reports/semgrep.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: security-reports/semgrep.sarif
          category: semgrep

      - name: Upload Trivy SARIF to GitHub Security
        if: ${{ always() && vars.ENABLE_CODE_SCANNING_UPLOAD == 'true' && hashFiles('security-reports/trivy.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: security-reports/trivy.sarif
          category: trivy

      - name: Add security summary
        if: always()
        run: |
          {
            echo "## Security Checks"
            echo ""
            echo "| Check | Purpose | Result |"
            echo "|---|---|---|"
            echo "| Gitleaks | Secrets in Git history and files | ${{ steps.gitleaks.outcome }} |"
            echo "| Semgrep | Static code analysis | ${{ steps.semgrep.outcome }} |"
            echo "| Semgrep gate | Severe findings | ${{ steps.semgrep_gate.outcome }} |"
            echo "| Trivy | Dependencies, secrets, misconfig | ${{ steps.trivy.outcome }} |"
            echo ""
            echo "Reports are available in the security-reports artifact."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail on security findings or scanner errors
        if: ${{ steps.gitleaks.outcome == 'failure' || steps.semgrep.outcome == 'failure' || steps.semgrep_gate.outcome == 'failure' || steps.trivy.outcome == 'failure' }}
        run: |
          echo "Security findings or a scanner error blocked the release. Check the security-reports artifact."
          exit 1
